<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Animated pulse glow -->
    <radialGradient id="splashGlow" cx="50%" cy="45%" r="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="20%" style="stop-color:#00d4ff;stop-opacity:0.5" />
      <stop offset="60%" style="stop-color:#00d4ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="coreGlowSplash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0088cc;stop-opacity:0.4" />
    </radialGradient>
    <linearGradient id="splashTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.8" />
    </linearGradient>
    <filter id="splashGlowFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Pulse animation -->
    <animateTransform id="pulse" attributeName="transform" attributeType="XML" type="scale" 
                      from="1" to="1.15" dur="2s" repeatCount="indefinite" additive="sum"/>
  </defs>
  
  <!-- Dark background with subtle gradient -->
  <rect width="1920" height="1080" fill="#0a0a0f"/>
  <rect width="1920" height="1080" fill="url(#splashGlow)"/>
  
  <!-- Grid pattern (subtle) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- Center icon (larger) -->
  <g transform="translate(960, 400)">
    <!-- Outer glow rings (pulsing) -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2">
      <animate attributeName="r" from="280" to="320" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.2" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="250" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.3">
      <animate attributeName="r" from="250" to="290" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <!-- Main hexagon -->
    <path d="M 0 -140 L 121 -70 L 121 70 L 0 140 L -121 70 L -121 -70 Z" 
          fill="rgba(0, 212, 255, 0.05)" 
          stroke="#00d4ff" 
          stroke-width="4" 
          opacity="0.9"
          filter="url(#splashGlowFilter)"/>
    
    <!-- Inner hexagon -->
    <path d="M 0 -110 L 95 -55 L 95 55 L 0 110 L -95 55 L -95 -55 Z" 
          fill="rgba(0, 212, 255, 0.08)" 
          stroke="#00d4ff" 
          stroke-width="2" 
          opacity="0.6"/>
    
    <!-- Arc reactor rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.8">
      <animate attributeName="opacity" from="0.8" to="0.4" dur="1.5s" repeatCount="indefinite" direction="alternate"/>
    </circle>
    
    <!-- Core (pulsing) -->
    <circle cx="0" cy="0" r="32" fill="url(#coreGlowSplash)" filter="url(#splashGlowFilter)">
      <animate attributeName="r" from="32" to="36" dur="1.5s" repeatCount="indefinite" direction="alternate"/>
    </circle>
    
    <!-- N pattern -->
    <line x1="-50" y1="-25" x2="-50" y2="25" stroke="#00d4ff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <line x1="-50" y1="-25" x2="50" y2="25" stroke="#00d4ff" stroke-width="5" stroke-linecap="round" opacity="0.8" filter="url(#splashGlowFilter)"/>
    <line x1="50" y1="-25" x2="50" y2="25" stroke="#00d4ff" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Node highlights -->
    <circle cx="-50" cy="-25" r="6" fill="#00d4ff" opacity="0.95"/>
    <circle cx="-50" cy="0" r="6" fill="#00d4ff" opacity="0.95"/>
    <circle cx="-50" cy="25" r="6" fill="#00d4ff" opacity="0.95"/>
    <circle cx="50" cy="-25" r="6" fill="#00d4ff" opacity="0.95"/>
    <circle cx="50" cy="0" r="6" fill="#00d4ff" opacity="0.95"/>
    <circle cx="50" cy="25" r="6" fill="#00d4ff" opacity="0.95"/>
  </g>
  
  <!-- NEXUS HUD text -->
  <g transform="translate(960, 650)">
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="'Arial Black', 'Impact', sans-serif" 
          font-size="110" 
          font-weight="900" 
          fill="url(#splashTextGrad)" 
          letter-spacing="18"
          filter="url(#splashGlowFilter)">NEXUS HUD</text>
  </g>
  
  <!-- AI COMMAND CENTER subtitle -->
  <g transform="translate(960, 710)">
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="'Arial', sans-serif" 
          font-size="28" 
          font-weight="300" 
          fill="#00d4ff" 
          letter-spacing="8"
          opacity="0.8">AI COMMAND CENTER</text>
  </g>
  
  <!-- INITIALIZING... text (animated) -->
  <g transform="translate(960, 920)">
    <text x="0" y="0" 
          text-anchor="middle"
          font-family="'Courier New', monospace" 
          font-size="24" 
          font-weight="600" 
          fill="#00d4ff" 
          letter-spacing="4"
          opacity="0.7">
      INITIALIZING
      <animate attributeName="opacity" from="0.7" to="0.3" dur="1s" repeatCount="indefinite" direction="alternate"/>
    </text>
    <!-- Animated dots -->
    <text x="140" y="0" 
          font-family="'Courier New', monospace" 
          font-size="24" 
          font-weight="600" 
          fill="#00d4ff">
      <tspan opacity="0.7">
        .
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.2s" repeatCount="indefinite" begin="0s"/>
      </tspan>
      <tspan opacity="0.7">
        .
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
      </tspan>
      <tspan opacity="0.7">
        .
        <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.2s" repeatCount="indefinite" begin="0.8s"/>
      </tspan>
    </text>
  </g>
  
  <!-- Bottom scan line animation -->
  <line x1="0" y1="1000" x2="1920" y2="1000" stroke="#00d4ff" stroke-width="2" opacity="0.4">
    <animate attributeName="y1" from="1080" to="0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" from="1080" to="0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0" to="0.6" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>