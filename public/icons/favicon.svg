<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </radialGradient>
    <filter id="favFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" fill="#0a0a0f" rx="8"/>
  
  <!-- Hexagon simplified -->
  <path d="M 32 10 L 50 20 L 50 44 L 32 54 L 14 44 L 14 20 Z" 
        fill="url(#favGlow)" 
        stroke="#00d4ff" 
        stroke-width="2" 
        opacity="0.8"
        filter="url(#favFilter)"/>
  
  <!-- Simplified N -->
  <line x1="23" y1="26" x2="23" y2="38" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="23" y1="26" x2="41" y2="38" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="41" y1="26" x2="41" y2="38" stroke="#00d4ff" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Core glow -->
  <circle cx="32" cy="32" r="4" fill="#00d4ff" opacity="0.9" filter="url(#favFilter)"/>
</svg>