<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180">
  <defs>
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="180" fill="#0a0a0f"/>
  
  <!-- NEXUS -->
  <text x="40" y="85" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="68" 
        font-weight="900" 
        fill="url(#wordmarkGrad)" 
        letter-spacing="10"
        filter="url(#textGlow)">NEXUS</text>
  
  <!-- HUD -->
  <text x="40" y="150" 
        font-family="'Arial Black', 'Impact', sans-serif" 
        font-size="64" 
        font-weight="900" 
        fill="url(#wordmarkGrad)" 
        letter-spacing="14"
        filter="url(#textGlow)">HUD</text>
  
  <!-- Connecting line -->
  <line x1="20" y1="90" x2="580" y2="90" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
</svg>